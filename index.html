<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票查價機</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/theme/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: "Microsoft JhengHei", sans-serif; padding: 40px 0; }
        .card { border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: none; }
        .btn-primary { background-color: #0d6efd; border: none; border-radius: 8px; }
        .btn-primary:hover { background-color: #0b5ed7; }
        .table-container { background: white; border-radius: 12px; padding: 20px; margin-top: 25px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .th-date { width: 25%; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="text-center mb-4">
                <h1 class="display-6 fw-bold text-dark">🚀 萬用股票點菜查價機 (網頁版)</h1>
                <p class="text-muted">免安裝任何環境！直接輸入代號與天數即可查詢最新數據。</p>
            </div>

            <div class="card p-4 bg-white">
                <div class="mb-3">
                    <label class="form-label fw-bold">🖨️ 請輸入股票代號：</label>
                    <input type="text" id="userStock" class="form-control form-control-lg" value="2330.TW" placeholder="例如: 2330.TW 或 NVDA">
                    <div class="form-text text-muted mt-2">
                        💡 常用熱門提示：台積電(2330.TW)、鴻海(2317.TW)、玉山金(2884.TW)、輝達(NVDA)<br>
                        <span class="text-danger">* 台灣股票記得一定要加 .TW 喔！</span>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">💬 請輸入你想查看過去幾天的詳細資料（輸入 1 代表只看最新交易日）：</label>
                    <input type="number" id="userDays" class="form-control" value="5" min="1" max="30">
                </div>

                <button onclick="startUniversalCrawler()" class="btn btn-primary w-100 fw-bold py-3 fs-5 mt-2">📡 開始下載精準數據</button>
            </div>

            <div id="loading" class="text-center my-4 d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-primary fw-bold" id="loadingText">正在連線網路驗證...</p>
            </div>

            <div id="errorMsg" class="alert alert-danger mt-4 d-none fw-bold"></div>

            <div id="resultContainer" class="d-none">
                <div id="analysisBox" class="alert mt-4 fw-bold fs-5"></div>

                <div class="table-container">
                    <h5 class="mb
