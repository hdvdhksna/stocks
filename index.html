<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>股票查價機</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body{
        background:#f4f6f9;
        font-family:"Microsoft JhengHei",sans-serif;
        padding:40px 0;
    }

    .card{
        border:none;
        border-radius:18px;
        box-shadow:0 4px 20px rgba(0,0,0,.08);
    }

    .table-container{
        background:white;
        border-radius:16px;
        padding:20px;
        margin-top:25px;
        box-shadow:0 2px 12px rgba(0,0,0,.05);
    }

    .stock-up{
        color:#dc3545;
        font-weight:bold;
    }

    .stock-down{
        color:#198754;
        font-weight:bold;
    }

    .stock-flat{
        color:#6c757d;
        font-weight:bold;
    }

    .loading-spinner{
        width:3rem;
        height:3rem;
    }

    .fade-in{
        animation:fadeIn .4s ease;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(10px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <!-- TITLE -->
            <div class="text-center mb-4">
                <h1 class="fw-bold">
                    📈 股票查價機
                </h1>

                <p class="text-muted">
                    支援台股、美股、成交量、快取、漲跌分析
                </p>
            </div>

            <!-- INPUT CARD -->
            <div class="card p-4">

                <div class="mb-3">
                    <label class="form-label fw-bold">
                        股票代號
                    </label>

                    <input
                        type="text"
                        id="userStock"
                        class="form-control form-control-lg"
                        placeholder="例如：2330、NVDA、AAPL"
                        value="2330"
                    >

                    <div class="form-text">
                        台股：2330、2317<br>
                        美股：NVDA、AAPL、TSLA
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">
                        顯示最近幾天
                    </label>

                    <input
                        type="number"
                        id="userDays"
                        class="form-control"
                        value="5"
                        min="1"
                        max="30"
                    >
                </div>

                <button
                    id="searchBtn"
                    class="btn btn-primary btn-lg fw-bold"
                >
                    📡 開始查詢
                </button>

            </div>

            <!-- LOADING -->
            <div
                id="loading"
                class="text-center mt-4 d-none"
            >
                <div class="spinner-border text-primary loading-spinner"></div>

                <p class="mt-3 fw-bold text-primary">
                    正在抓取全球金融資料...
                </p>
            </div>

            <!-- ERROR -->
            <div
                id="errorMsg"
                class="alert alert-danger mt-4 d-none fw-bold"
            ></div>

            <!-- RESULT -->
            <div
                id="resultContainer"
                class="d-none fade-in"
            >

                <!-- ANALYSIS -->
                <div
                    id="analysisBox"
                    class="alert mt-4 fw-bold fs-5"
                ></div>

                <!-- TABLE -->
                <div class="table-container">

                    <h4
                        id="tableTitle"
                        class="mb-4 fw-bold text-secondary"
                    ></h4>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle text-center">

                            <thead class="table-dark">
                                <tr>
                                    <th>日期</th>
                                    <th>開盤</th>
                                    <th>最高</th>
                                    <th>最低</th>
                                    <th>收盤</th>
                                    <th>成交量</th>
                                </tr>
                            </thead>

                            <tbody id="stockTableBody"></tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>
    </div>
</div>

<script>

const elements = {
    stockInput: document.getElementById("userStock"),
    daysInput: document.getElementById("userDays"),
    searchBtn: document.getElementById("searchBtn"),

    loading: document.getElementById("loading"),
    errorMsg: document.getElementById("errorMsg"),

    resultContainer: document.getElementById("resultContainer"),

    analysisBox: document.getElementById("analysisBox"),

    tableTitle: document.getElementById("tableTitle"),

    tableBody: document.getElementById("stockTableBody")
};

elements.searchBtn.addEventListener("click", startCrawler);

async function startCrawler(){

    const stockId = elements.stockInput.value.trim().toUpperCase();

    const days = parseInt(elements.daysInput.value);

    if(!stockId || isNaN(days) || days < 1){

        showError("❌ 請輸入正確的股票代號與天數");

        return;
    }

    resetUI();

    elements.loading.classList.remove("d-none");

    elements.searchBtn.disabled = true;

    try{

        const isTaiwanStock = /^\d+$/.test(stockId);

        let historicalData = [];

        if(isTaiwanStock){

            historicalData = await fetchTaiwanStock(stockId);

        }else{

            historicalData = await fetchUSStock(stockId);
        }

        if(!historicalData.length){

            throw new Error("找不到資料");
        }

        historicalData.sort(
            (a,b) => new Date(b.date) - new Date(a.date)
        );

        const displayData = historicalData.slice(0,days);

        renderTable(stockId,displayData);

        renderAnalysis(displayData);

        elements.resultContainer.classList.remove("d-none");

    }catch(err){

        showError(`❌ ${err.message}`);

    }finally{

        elements.loading.classList.add("d-none");

        elements.searchBtn.disabled = false;
    }
}

async function fetchTaiwanStock(stockId){

    const cacheKey = `stock_${stockId}`;

    const cachedData = getCache(cacheKey);

    if(cachedData){

        return cachedData;
    }

    const url =
        `https://api.allorigins.win/get?url=${
            encodeURIComponent(
                `https://query1.finance.yahoo.com/v8/finance/chart/${stockId}.TW?range=60d&interval=1d`
            )
        }`;

    const response = await fetch(url);

    if(!response.ok){

        throw new Error("台股 API 連線失敗");
    }

    const jsonResult = await response.json();

    const data = JSON.parse(jsonResult.contents);

    const result = data.chart.result
        ? data.chart.result[0]
        : null;

    if(!result){

        throw new Error(`找不到台股 ${stockId}`);
    }

    const timestamps = result.timestamp;

    const quote = result.indicators.quote[0];

    const history = [];

    for(let i=0;i<timestamps.length;i++){

        if(
            quote.open[i] != null &&
            quote.high[i] != null &&
            quote.low[i] != null &&
            quote.close[i] != null
        ){

            const dateObj = new Date(
                timestamps[i] * 1000
            );

            history.push({

                date: dateObj.toLocaleDateString("zh-TW"),

                open: quote.open[i],

                high: quote.high[i],

                low: quote.low[i],

                close: quote.close[i],

                volume: quote.volume[i],

                currency:"元"
            });
        }
    }

    setCache(cacheKey,history);

    return history;
}

async function fetchUSStock(stockId){

    const cacheKey = `stock_${stockId}`;

    const cachedData = getCache(cacheKey);

    if(cachedData){

        return cachedData;
    }

    /*
        ⚠️ 正式環境不要把 API KEY 放前端
    */

    const apiKey = "YOUR_API_KEY";

    const today = new Date();

    const fromDate = new Date();

    fromDate.setDate(today.getDate()-60);

    const url =
        `https://api.polygon.io/v2/aggs/ticker/${stockId}/range/1/day/${
            fromDate.toISOString().split("T")[0]
        }/${
            today.toISOString().split("T")[0]
        }?adjusted=true&sort=desc&limit=50&apiKey=${apiKey}`;

    const response = await fetch(url);

    if(!response.ok){

        throw new Error("美股 API 連線失敗");
    }

    const data = await response.json();

    if(data.status !== "OK"){

        throw new Error(`找不到美股 ${stockId}`);
    }

    const history = data.results.map(day=>{

        return{

            date:new Date(day.t).toLocaleDateString("zh-TW"),

            open:day.o,

            high:day.h,

            low:day.l,

            close:day.c,

            volume:day.v,

            currency:"美元"
        };
    });

    setCache(cacheKey,history);

    return history;
}

function renderTable(stockId,data){

    elements.tableBody.innerHTML = "";

    elements.tableTitle.innerText =
        `📊 ${stockId} 最近 ${data.length} 個交易日`;

    data.forEach((day,index)=>{

        let rowClass = "stock-flat";

        if(index < data.length - 1){

            const prevClose = data[index+1].close;

            if(day.close > prevClose){

                rowClass = "stock-up";

            }else if(day.close < prevClose){

                rowClass = "stock-down";
            }
        }

        const row = document.createElement("tr");

        row.innerHTML = `
            <td><strong>${day.date}</strong></td>

            <td>$${day.open.toFixed(2)}</td>

            <td class="text-danger">
                $${day.high.toFixed(2)}
            </td>

            <td class="text-success">
                $${day.low.toFixed(2)}
            </td>

            <td class="${rowClass}">
                $${day.close.toFixed(2)}
            </td>

            <td>
                ${formatVolume(day.volume)}
            </td>
        `;

        elements.tableBody.appendChild(row);
    });
}

function renderAnalysis(data){

    if(data.length < 2){

        elements.analysisBox.className =
            "alert alert-info mt-4 fw-bold fs-5";

        elements.analysisBox.innerHTML =
            "📌 資料不足，無法分析漲跌";

        return;
    }

    const latest = data[0];

    const previous = data[1];

    const diff = latest.close - previous.close;

    const diffText = Math.abs(diff).toFixed(2);

    if(diff > 0){

        elements.analysisBox.className =
            "alert alert-success mt-4 fw-bold fs-5";

        elements.analysisBox.innerHTML =
            `📈 最新交易日上漲 ${diffText} ${latest.currency}`;

    }else if(diff < 0){

        elements.analysisBox.className =
            "alert alert-danger mt-4 fw-bold fs-5";

        elements.analysisBox.innerHTML =
            `📉 最新交易日下跌 ${diffText} ${latest.currency}`;

    }else{

        elements.analysisBox.className =
            "alert alert-warning mt-4 fw-bold fs-5";

        elements.analysisBox.innerHTML =
            "📌 最新交易日平盤";
    }
}

function formatVolume(volume){

    if(volume >= 100000000){

        return (volume / 100000000).toFixed(2) + " 億";
    }

    if(volume >= 10000){

        return (volume / 10000).toFixed(2) + " 萬";
    }

    return volume.toLocaleString();
}

function showError(message){

    elements.errorMsg.innerText = message;

    elements.errorMsg.classList.remove("d-none");
}

function resetUI(){

    elements.errorMsg.classList.add("d-none");

    elements.resultContainer.classList.add("d-none");

    elements.tableBody.innerHTML = "";
}

function setCache(key,data){

    const cacheData = {

        timestamp:Date.now(),

        data:data
    };

    localStorage.setItem(
        key,
        JSON.stringify(cacheData)
    );
}

function getCache(key){

    const raw = localStorage.getItem(key);

    if(!raw){

        return null;
    }

    const cache = JSON.parse(raw);

    const now = Date.now();

    const FIVE_MINUTES = 1000 * 60 * 5;

    if(now - cache.timestamp > FIVE_MINUTES){

        localStorage.removeItem(key);

        return null;
    }

    return cache.data;
}

</script>

</body>
</html>
