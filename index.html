<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>股票查價機 Ultimate</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<style>

body{
    background:#f4f6f9;
    font-family:"Microsoft JhengHei",sans-serif;
    padding:40px 0;
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.table-container{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-top:25px;
}

.stock-up{
    color:#dc3545;
    font-weight:bold;
}

.stock-down{
    color:#198754;
    font-weight:bold;
}

.stock-flat{
    color:#6c757d;
    font-weight:bold;
}

.loading-spinner{
    width:3rem;
    height:3rem;
}

.fade-in{
    animation:fadeIn .4s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    font-size:60px;
}

</style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-9">

<div class="text-center mb-4">

<div class="logo">
📈
</div>

<h1 class="fw-bold">
股票查價機 Ultimate
</h1>

<p class="text-muted">
支援台股 / 美股 / 成交量 / 漲跌分析
</p>

</div>

<div class="card p-4">

<div class="mb-3">

<label class="form-label fw-bold">
股票代號
</label>

<input
type="text"
id="userStock"
class="form-control form-control-lg"
placeholder="2330、2317、NVDA、AAPL"
value="2330"
>

<div class="form-text">

台股：
2330、2317、2454、0050<br>

美股：
NVDA、AAPL、TSLA

</div>

</div>

<div class="mb-3">

<label class="form-label fw-bold">
最近幾天
</label>

<input
type="number"
id="userDays"
class="form-control"
value="5"
min="1"
max="30"
>

</div>

<button
id="searchBtn"
class="btn btn-primary btn-lg fw-bold"
>

📡 開始查詢

</button>

</div>

<div
id="loading"
class="text-center mt-4 d-none"
>

<div
class="spinner-border text-primary loading-spinner"
></div>

<p class="mt-3 fw-bold text-primary">
正在抓取全球金融資料...
</p>

</div>

<div
id="errorMsg"
class="alert alert-danger mt-4 d-none fw-bold"
></div>

<div
id="resultContainer"
class="d-none fade-in"
>

<div
id="analysisBox"
class="alert mt-4 fw-bold fs-5"
></div>

<div class="table-container">

<h4
id="tableTitle"
class="mb-4 fw-bold text-secondary"
></h4>

<div class="table-responsive">

<table
class="table table-hover text-center align-middle"
>

<thead class="table-dark">

<tr>

<th>日期</th>

<th>開盤</th>

<th>最高</th>

<th>最低</th>

<th>收盤</th>

<th>成交量</th>

</tr>

</thead>

<tbody id="stockTableBody"></tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

const elements = {

    stockInput:
        document.getElementById(
            "userStock"
        ),

    daysInput:
        document.getElementById(
            "userDays"
        ),

    searchBtn:
        document.getElementById(
            "searchBtn"
        ),

    loading:
        document.getElementById(
            "loading"
        ),

    errorMsg:
        document.getElementById(
            "errorMsg"
        ),

    resultContainer:
        document.getElementById(
            "resultContainer"
        ),

    analysisBox:
        document.getElementById(
            "analysisBox"
        ),

    tableTitle:
        document.getElementById(
            "tableTitle"
        ),

    tableBody:
        document.getElementById(
            "stockTableBody"
        )
};

elements.searchBtn.addEventListener(
    "click",
    startCrawler
);

async function startCrawler(){

    const stockId =
        elements.stockInput.value
            .trim()
            .toUpperCase();

    const days =
        parseInt(
            elements.daysInput.value
        );

    if(!stockId){

        showError(
            "❌ 請輸入股票代號"
        );

        return;
    }

    resetUI();

    elements.loading.classList.remove(
        "d-none"
    );

    elements.searchBtn.disabled = true;

    try{

        const isTaiwanStock =
            /^\d+$/.test(stockId);

        let symbol = stockId;

        /*
            台股自動加 .TW
        */

        if(isTaiwanStock){

            symbol += ".TW";
        }

        /*
            直接打 Yahoo Finance API
        */

        const url =
            `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?range=60d&interval=1d`;

        const response =
            await fetch(url);

        if(!response.ok){

            throw new Error(
                "API 連線失敗"
            );
        }

        const data =
            await response.json();

        const result =
            data.chart.result
                ? data.chart.result[0]
                : null;

        if(!result){

            throw new Error(
                "找不到股票資料"
            );
        }

        const timestamps =
            result.timestamp;

        const quote =
            result.indicators.quote[0];

        const history = [];

        for(
            let i=0;
            i<timestamps.length;
            i++
        ){

            if(

                quote.open[i] != null &&

                quote.high[i] != null &&

                quote.low[i] != null &&

                quote.close[i] != null

            ){

                history.push({

                    date:
                        new Date(
                            timestamps[i] * 1000
                        ).toLocaleDateString(
                            "zh-TW"
                        ),

                    open:
                        quote.open[i],

                    high:
                        quote.high[i],

                    low:
                        quote.low[i],

                    close:
                        quote.close[i],

                    volume:
                        quote.volume[i],

                    currency:
                        isTaiwanStock
                            ? "元"
                            : "美元"
                });
            }
        }

        history.sort(
            (a,b)=>

                new Date(b.date) -

                new Date(a.date)
        );

        const displayData =
            history.slice(0,days);

        renderTable(
            stockId,
            displayData
        );

        renderAnalysis(
            displayData
        );

        elements.resultContainer.classList.remove(
            "d-none"
        );

    }catch(err){

        showError(
            err.message
        );

    }finally{

        elements.loading.classList.add(
            "d-none"
        );

        elements.searchBtn.disabled = false;
    }
}

function renderTable(
    stockId,
    data
){

    elements.tableBody.innerHTML = "";

    elements.tableTitle.innerText =
        `${stockId} 最近 ${data.length} 天`;

    data.forEach((day,index)=>{

        let rowClass =
            "stock-flat";

        if(index < data.length - 1){

            const prevClose =
                data[index+1].close;

            if(day.close > prevClose){

                rowClass =
                    "stock-up";

            }else if(
                day.close < prevClose
            ){

                rowClass =
                    "stock-down";
            }
        }

        const row =
            document.createElement(
                "tr"
            );

        row.innerHTML = `

            <td>

                <strong>
                    ${day.date}
                </strong>

            </td>

            <td>
                $${day.open.toFixed(2)}
            </td>

            <td class="text-danger">
                $${day.high.toFixed(2)}
            </td>

            <td class="text-success">
                $${day.low.toFixed(2)}
            </td>

            <td class="${rowClass}">
                $${day.close.toFixed(2)}
            </td>

            <td>
                ${formatVolume(day.volume)}
            </td>

        `;

        elements.tableBody.appendChild(
            row
        );
    });
}

function renderAnalysis(data){

    if(data.length < 2){

        return;
    }

    const latest =
        data[0];

    const prev =
        data[1];

    const diff =
        latest.close -
        prev.close;

    const absDiff =
        Math.abs(diff)
            .toFixed(2);

    if(diff > 0){

        elements.analysisBox.className =
            "alert alert-success mt-4 fw-bold";

        elements.analysisBox.innerHTML =

            `📈 上漲 ${absDiff} ${latest.currency}`;

    }else if(diff < 0){

        elements.analysisBox.className =
            "alert alert-danger mt-4 fw-bold";

        elements.analysisBox.innerHTML =

            `📉 下跌 ${absDiff} ${latest.currency}`;

    }else{

        elements.analysisBox.className =
            "alert alert-warning mt-4 fw-bold";

        elements.analysisBox.innerHTML =

            "📌 平盤";
    }
}

function formatVolume(volume){

    if(volume >= 100000000){

        return (

            volume / 100000000

        ).toFixed(2) + " 億";
    }

    if(volume >= 10000){

        return (

            volume / 10000

        ).toFixed(2) + " 萬";
    }

    return volume.toLocaleString();
}

function showError(msg){

    elements.errorMsg.innerText =
        msg;

    elements.errorMsg.classList.remove(
        "d-none"
    );
}

function resetUI(){

    elements.errorMsg.classList.add(
        "d-none"
    );

    elements.resultContainer.classList.add(
        "d-none"
    );

    elements.tableBody.innerHTML = "";
}

</script>

</body>

</html>
